target-version = "py312"
line-length = 100

[lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "S",   # flake8-bandit (security)
    "N",   # pep8-naming
]
ignore = [
    "S101",  # assert used — OK in tests
    "B008",  # function call in default arg — FastAPI Depends pattern
]

[lint.per-file-ignores]
"tests/*" = ["S", "N", "E501"]
"agents/docs.py" = ["E501"]
"agents/security.py" = ["E501"]
"agents/test_agent.py" = ["E501", "C416"]
"api/models/*.py" = ["F821"]
"api/config.py" = ["S104"]

[format]
quote-style = "double"
indent-style = "space"
